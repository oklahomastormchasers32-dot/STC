<!DOCTYPE html>
<html>
<head>
  <title>Models - STC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      color: white;
      background: linear-gradient(135deg, #020617, #0b0f14, #111827);
    }

    h1 {
      text-align: center;
      padding: 20px;
    }

    .top-bar {
      text-align: center;
      padding: 10px;
    }

    .controls {
      text-align: center;
      padding: 15px;
    }

    select, button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: rgba(31, 41, 55, 0.9);
      padding: 15px;
      border-radius: 15px;
      width: 220px;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      position: relative;
    }

    .card:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(96,165,250,0.6);
    }

    .thumb {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    .fav {
      position: absolute;
      top: 8px;
      right: 10px;
      cursor: pointer;
      font-size: 18px;
    }

    .fullscreen-btn {
      position: fixed;
      bottom: 15px;
      right: 15px;
      padding: 10px;
      background: #1f2937;
      border-radius: 8px;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <h1>📊 Weather Models</h1>

  <div class="top-bar">
    <a href="index.html" style="color:#60a5fa;">⬅ Back Home</a>
  </div>

  <!-- Controls -->
  <div class="controls">
    <label>Forecast Type:</label>
    <select id="param">
      <option value="temp">🌡️ Temperature</option>
      <option value="cape">⚡ CAPE</option>
      <option value="wind">🌪️ Wind</option>
      <option value="precip">🌧️ Precipitation</option>
      <option value="pressure">🌀 Pressure</option>
    </select>

    <button onclick="compareModels()">📊 Compare</button>
  </div>

  <!-- Models -->
  <div class="container" id="models"></div>

  <!-- Fullscreen Button -->
  <div class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</div>

  <script>
    const models = [
      { name: "GFS", id: "gfs", thumb: "https://www.tropicaltidbits.com/analysis/models/thumbs/gfs.png" },
      { name: "HRRR", id: "hrrr", thumb: "https://www.tropicaltidbits.com/analysis/models/thumbs/hrrr.png" },
      { name: "NAM", id: "nam", thumb: "https://www.tropicaltidbits.com/analysis/models/thumbs/nam.png" },
      { name: "RAP", id: "rap", thumb: "https://www.tropicaltidbits.com/analysis/models/thumbs/rap.png" },
      { name: "ECMWF", id: "ecmwf", thumb: "https://www.tropicaltidbits.com/analysis/models/thumbs/ecmwf.png" }
    ];

    const container = document.getElementById("models");

    function loadFavorites() {
      return JSON.parse(localStorage.getItem("favorites") || "[]");
    }

    function toggleFavorite(name) {
      let favs = loadFavorites();

      if (favs.includes(name)) {
        favs = favs.filter(f => f !== name);
      } else {
        favs.push(name);
      }

      localStorage.setItem("favorites", JSON.stringify(favs));
      render();
    }

    function isFav(name) {
      return loadFavorites().includes(name);
    }

    function openModel(model) {
      let param = document.getElementById("param").value;

      // Pivotal Weather (better parameter support)
      let url = `https://www.pivotalweather.com/model.php?m=${model}&p=${param}`;

      window.open(url, "_blank");
    }

    function compareModels() {
      models.forEach(m => {
        let param = document.getElementById("param").value;
        let url = `https://www.pivotalweather.com/model.php?m=${m.id}&p=${param}`;
        window.open(url, "_blank");
      });
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function render() {
      container.innerHTML = "";

      models.forEach(model => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="fav" onclick="toggleFavorite('${model.name}')">
            ${isFav(model.name) ? "⭐" : "☆"}
          </div>

          <h2>${model.name}</h2>

          <img class="thumb" src="${model.thumb}" alt="preview">

          <button onclick="openModel('${model.id}')">Open</button>
        `;

        container.appendChild(card);
      });
    }

    render();
  </script>

</body>
</html>
