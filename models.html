<!DOCTYPE html>
<html>
<head>
  <title>Models</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>

<body style="margin:0; font-family:sans-serif; background:#0b0f14; color:white; text-align:center;">

<div id="banner" style="display:none; padding:10px; font-weight:bold;">
  <marquee id="bannerText"></marquee>
</div>

<h1>📊 Models</h1>

<a href="index.html">Back Home</a>

<div>
  <button onclick="openModel('gfs')">GFS</button>
  <button onclick="openModel('hrrr')">HRRR</button>
  <button onclick="openModel('nam')">NAM</button>
  <button onclick="openModel('rap')">RAP</button>
  <button onclick="openModel('ecmwf')">ECMWF</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzL9TJ3i0u2U0lRoRnHOXKycPtoQmtB10",
  authDomain: "stcalerts.firebaseapp.com",
  projectId: "stcalerts",
  storageBucket: "stcalerts.firebasestorage.app",
  messagingSenderId: "570130296780",
  appId: "1:570130296780:web:cf376823ff4c68108db769",
  databaseURL: "https://stcalerts-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function openModel(m){
  window.open("https://www.pivotalweather.com/model.php?m="+m, "_blank");
}

db.ref("alerts/current").on("value", snapshot => {
  const alert = snapshot.val();
  if (!alert) return;

  let banner = document.getElementById("banner");
  let text = document.getElementById("bannerText");

  let message = "";

  if (alert.type === "tornado_warning") {
    message = "🚨 TORNADO WARNING 🚨";
    banner.style.background = "red";
  } else if (alert.type === "tornado_watch") {
    message = "⚠️ TORNADO WATCH ⚠️";
    banner.style.background = "orange";
  } else if (alert.type === "custom") {
    message = alert.text;
    banner.style.background = "#2563eb";
  }

  text.innerText = message;
  banner.style.display = "block";
});
</script>

</body>
</html>
