<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel - STC</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    body {
      margin:0;
      font-family:sans-serif;
      background:#0b0f14;
      color:white;
      text-align:center;
    }

    input, select, button {
      padding:10px;
      margin:5px;
      border-radius:8px;
      border:none;
    }

    button {
      cursor:pointer;
      background:#1f2937;
      color:white;
    }

    .panel {
      display:none;
      margin-top:20px;
    }

    .progress {
      width:300px;
      height:10px;
      background:#333;
      margin:10px auto;
      border-radius:5px;
    }

    .bar {
      height:10px;
      width:0%;
      background:lime;
      border-radius:5px;
    }
  </style>
</head>

<body>

<h1>🔐 Admin Panel</h1>

<a href="index.html" style="color:#60a5fa;">⬅ Back Home</a>

<!-- Step 1 -->
<div id="step1">
  <p>Step 1 Password</p>
  <input type="password" id="p1">
  <button onclick="check1()">Submit</button>
</div>

<!-- Step 2 -->
<div id="step2" style="display:none;">
  <p>Step 2 Password</p>
  <input type="password" id="p2">
  <button onclick="check2()">Unlock</button>
</div>

<!-- Admin Controls -->
<div id="adminPanel" class="panel">

  <h2>Controls</h2>

  <!-- Status -->
  <h3>Status</h3>
  <button onclick="setStatus('OFFLINE')">OFFLINE</button>
  <button onclick="setStatus('LIVE')">LIVE</button>
  <button onclick="setStatus('CHASING')">CHASING</button>

  <!-- Alerts -->
  <h3>🚨 Alerts</h3>

  <select id="alertType">
    <option value="none">None</option>
    <option value="tornado_warning">Tornado Warning</option>
    <option value="tornado_watch">Tornado Watch</option>
    <option value="severe_warning">Severe Thunderstorm Warning</option>
    <option value="custom">Custom Text</option>
  </select>

  <br>

  <input id="customText" placeholder="Custom alert text" style="width:250px;">

  <br>

  <label>Transmit Speed (seconds):</label>
  <select id="speed">
    <option value="6">6 sec</option>
    <option value="8">8 sec</option>
    <option value="10">10 sec</option>
    <option value="12">12 sec</option>
    <option value="15">15 sec</option>
  </select>

  <br><br>

  <button onclick="sendAlert()">Transmit Alert</button>
  <button onclick="deleteAlert()">Delete Alert</button>

  <!-- Progress Bar -->
  <div class="progress">
    <div id="bar" class="bar"></div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzL9TJ3i0u2U0lRoRnHOXKycPtoQmtB10",
  authDomain: "stcalerts.firebaseapp.com",
  projectId: "stcalerts",
  storageBucket: "stcalerts.firebasestorage.app",
  messagingSenderId: "570130296780",
  appId: "1:570130296780:web:cf376823ff4c68108db769",
  databaseURL: "https://stcalerts-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Login
function check1() {
  if (document.getElementById("p1").value === "4141") {
    document.getElementById("step2").style.display = "block";
  } else {
    alert("Wrong password");
  }
}

function check2() {
  if (document.getElementById("p2").value === "5505") {
    document.getElementById("adminPanel").style.display = "block";
  } else {
    alert("Wrong password");
  }
}

// Status
function setStatus(status) {
  db.ref("status").set(status);
}

// Send alert
function sendAlert() {
  let type = document.getElementById("alertType").value;
  let text = document.getElementById("customText").value;
  let speed = parseInt(document.getElementById("speed").value);

  let alertData = {
    type: type,
    text: text,
    expires: Date.now() + 3600000
  };

  db.ref("alerts/current").set(alertData);

  // Progress bar animation
  let bar = document.getElementById("bar");
  let width = 0;
  bar.style.width = "0%";

  let interval = setInterval(() => {
    width += 1;
    bar.style.width = width + "%";
    if (width >= 100) clearInterval(interval);
  }, (speed * 1000) / 100);
}

// Delete alert
function deleteAlert() {
  db.ref("alerts/current").remove();
}
</script>

</body>
</html>
